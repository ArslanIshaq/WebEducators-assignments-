<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Navbar</title>
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- =================================================================================================================== -->

<body class="bg-light">

    <!-- NAVBAR START -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm sticky-top py-3">
        <div class="container">
            
            <!-- Logo (Left) -->
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2 text-dark fs-4" href="#home">
                <span class="brand-icon bg-dark text-white rounded-3 d-inline-flex align-items-center justify-content-center shadow-sm">
                    <i class="fa-solid fa-cube"></i>
                </span>
                <span>Mehar<span class="text-danger">Arslan</span></span>
            </a>


            <!-- Mobile Hamburger Toggle Button -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Nav Links (Right) -->
           <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
    <ul class="navbar-nav gap-lg-3 pt-3 pt-lg-0">
        <li class="nav-item">
            <a class="nav-link active text-dark fw-bold d-flex align-items-center gap-2 px-2" aria-current="page" href="#home">
                <i class="fa-solid fa-house text-dark"></i>
                <span>Home</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-dark fw-bold d-flex align-items-center gap-2 px-2" href="#about">
                <i class="fa-solid fa-user text-dark"></i>
                <span>About</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-dark fw-bold d-flex align-items-center gap-2 px-2" href="#services">
                <i class="fa-solid fa-briefcase text-dark"></i>
                <span>Services</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-dark fw-bold d-flex align-items-center gap-2 px-2" href="#blog">
                <i class="fa-solid fa-newspaper text-dark"></i>
                <span>Blog</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-dark fw-bold d-flex align-items-center gap-2 px-2" href="#contact">
                <i class="fa-solid fa-envelope text-dark"></i>
                <span>Contact Us</span>
            </a>
        </li>
    </ul>
</div>

        </div>
    </nav>
    <!-- NAVBAR END -->
</body>
</html>
